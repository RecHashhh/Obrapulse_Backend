name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build y push imagen a ACR
        run: |
          az acr build \
            --registry obrapulseregistry \
            --image obrapulse-api:${{ github.sha }} \
            --image obrapulse-api:latest \
            .

      - name: Deploy a App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: api-obrapulse
          images: obrapulseregistry.azurecr.io/obrapulse-api:${{ github.sha }}
